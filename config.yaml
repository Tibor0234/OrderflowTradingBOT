# ==================== USER CONFIG ====================
# Market symbols and session ranges to process.
symbols:

sessions_numbers:
  - 2

# Initial account balance and exchange fees in percent.
starting_balance: 100000

maker_fee_rate: 0.02
taker_fee_rate: 0.06

# Choose where each statistic is displayed.
statistics:
  total_trades:            { dashboard: true,  report: true }
  trades_won:              { dashboard: false, report: true }
  trades_lost:             { dashboard: false, report: true }
  winrate:                 { dashboard: true,  report: true }
  roi:                     { dashboard: true,  report: true }
  max_drawdown:            { dashboard: true,  report: true }
  pnl:                     { dashboard: true,  report: true }
  average_win:             { dashboard: false, report: true }
  average_loss:            { dashboard: false, report: true }
  expectency:              { dashboard: true,  report: true }
  average_trade_duration:  { dashboard: true,  report: true }